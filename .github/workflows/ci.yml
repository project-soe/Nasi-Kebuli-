name: Pemeriksaan kode dan aturan Firestore

on:
  push:
  pull_request:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java (dibutuhkan emulator Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pasang alat tes
        run: npm install --no-audit --no-fund

      - name: Periksa sintaks JavaScript
        run: npm run check:js

      - name: Tes aturan Firestore (emulator)
        run: npm run test:rules
