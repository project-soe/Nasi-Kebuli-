<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin | Kebuli Ikhsan</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2b1810">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>document.documentElement.classList.add('js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="admin">

  <!-- Layar pemeriksaan akses -->
  <div class="admin-loading" id="admin-loading">
    <svg class="admin-loading__mark" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-mark"/></svg>
    <p id="admin-loading-text">Memeriksa akses&hellip;</p>
  </div>

  <div class="page" id="admin-app" hidden>

    <header class="site-header">
      <div class="container site-header__inner">
        <div class="site-header__brand">
          <svg class="btn__icon" style="width:1.8rem;height:1.8rem" aria-hidden="true"><use href="../assets/icons/sprite.svg#i-mark"/></svg>
          <span><span data-store-name>Kebuli Ikhsan</span> &middot; Admin</span>
        </div>

        <div class="admin-header__actions">
          <label class="admin-open">
            <span id="open-label">Buka</span>
            <span class="switch">
              <input type="checkbox" role="switch" id="open-toggle" aria-label="Toko buka">
              <span class="switch__track"></span>
            </span>
          </label>
          <button class="btn btn--ghost btn--sm" type="button" id="logout-btn">Keluar</button>
        </div>
      </div>
    </header>

    <main class="page__main admin-main">

      <!-- PESANAN -->
      <section id="panel-pesanan" class="admin-panel" aria-label="Pesanan">
        <div class="container">
          <div class="filter-bar" id="order-filter" role="group" aria-label="Filter status pesanan"></div>
          <div class="order-grid" id="order-list" aria-live="polite"></div>
        </div>
      </section>

      <!-- MENU -->
      <section id="panel-menu" class="admin-panel" aria-label="Menu" hidden>
        <div class="container container--narrow" id="menu-admin"></div>
      </section>

      <!-- TOKO -->
      <section id="panel-toko" class="admin-panel" aria-label="Pengaturan toko" hidden>
        <div class="container container--narrow" id="store-admin"></div>
      </section>

    </main>
  </div>

  <nav class="admin-tabs" aria-label="Bagian admin">
    <div class="admin-tabs__inner" role="tablist">
      <button class="admin-tab is-active" type="button" role="tab" data-tab="pesanan" aria-selected="true">
        <span class="admin-tab__icon">
          <svg aria-hidden="true"><use href="../assets/icons/sprite.svg#i-list"/></svg>
          <span class="admin-tab__badge" id="tab-pending" hidden>0</span>
        </span>
        Pesanan
      </button>
      <button class="admin-tab" type="button" role="tab" data-tab="menu" aria-selected="false">
        <span class="admin-tab__icon"><svg aria-hidden="true"><use href="../assets/icons/sprite.svg#i-dish"/></svg></span>
        Menu
      </button>
      <button class="admin-tab" type="button" role="tab" data-tab="toko" aria-selected="false">
        <span class="admin-tab__icon"><svg aria-hidden="true"><use href="../assets/icons/sprite.svg#i-store"/></svg></span>
        Toko
      </button>
    </div>
  </nav>

  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <!-- Diagnosa: bila skrip halaman tidak berjalan, tampilkan kemungkinan penyebabnya -->
  <script>
    (function () {
      function show(text) {
        var box = document.getElementById('login-error') || document.getElementById('admin-loading-text');
        if (box) { box.textContent = text; box.hidden = false; }
      }
      window.addEventListener('error', function (e) { show('Kesalahan skrip: ' + (e.message || 'tidak diketahui')); });
      window.addEventListener('unhandledrejection', function (e) {
        show('Kesalahan: ' + ((e.reason && (e.reason.code || e.reason.message)) || 'tidak diketahui'));
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__appReady) return;
          show(location.protocol === 'file:'
            ? 'Halaman dibuka langsung dari file. Buka lewat server lokal, misalnya http://localhost:8080/admin/login.html'
            : 'Skrip halaman gagal dimuat. Muat ulang halaman dan pastikan server lokal masih berjalan.');
        }, 3000);
      });
    })();
  </script>
  <script type="module" src="../js/pages/admin.js"></script>
</body>
</html>
